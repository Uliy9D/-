":"T02","stageId":"summary","title":"近距症狀的判斷","evidenceIds":["HISTORY","COVER","W4D","NPC","NPA"],"kind":"interpretation","weight":3,"optionalModule":null,"baselineOptionId":"T02_1","options":[{"id":"T02_1","label":"近cc 1.0，沒有近距雙眼視覺功能問題","recordText":"近距無功能問題，因為近cc VA達1.0"},{"id":"T02_2","label":"近外隱斜／NPC偏遠，確診集合不足並定療程","recordText":"近外隱斜較大與NPC偏遠，判定已確診集合不足；直接決定稜鏡量或訓練療程"},{"id":"T02_3","label":"近重影／外隱斜／NPC提示集合可疑，待PFV等","recordText":"近距重影、近外隱斜較大與NPC偏遠：集合功能問題可疑，安排PFV等評估"},{"id":"T02_4","label":"NPA8／9 cm主導調節不足，眼位／NPC不需整合","recordText":"近距疲勞且NPA8／9 cm：調節不足是首要判斷，近外隱斜與NPC不需再整合"}]},{"id":"T03","stageId":"summary","title":"眼表／波動視力問題的判斷","evidenceIds":["HISTORY","K_INITIAL","K_REPEAT","SLIT_SURFACE"],"kind":"interpretation","weight":3,"optionalModule":null,"baselineOptionId":"T03_1","options":[{"id":"T03_1","label":"角膜白光清澈，眼表問題清單不需增加","recordText":"眼表完全正常，因為角膜白光下清澈"},{"id":"T03_2","label":"霧感主要為水晶體調節問題，不列淚膜瞼緣","recordText":"眨眼改善霧感但角膜透明：主要歸為水晶體調節問題，淚膜與瞼緣所見不需列問題清單"},{"id":"T03_3","label":"首次mires不規則，仍主判固定角膜形態異常","recordText":"mires曾不規則：主要歸為固定角膜形態異常，眨眼後一致K值與瞼緣所見不改變判斷"},{"id":"T03_4","label":"淚膜／眼表可疑，染色及TBUT未測，待評估","recordText":"眨眼、淚液弧與瞼緣線索提示眼表／淚膜不穩定；染色及TBUT未測，待完整評估"}]},{"id":"T04","stageId":"summary","title":"最合適的後續計畫","evidenceIds":["HISTORY","VA","NPC","SLIT_SURFACE","FUNDUS_OBSERVED"],"kind":"plan","weight":3,"optionalModule":null,"baselineOptionId":"T04_1","options":[{"id":"T04_1","label":"皆正常，只維持原例行追蹤與用眼建議","recordText":"全部結果正常，只維持例行追蹤"},{"id":"T04_2","label":"列完整屈光、眼位／PFV等與眼表後續評估","recordText":"列完整屈光驗光、近距眼位／PFV等雙眼視覺評估，以及眼表檢查／處置評估"},{"id":"T04_3","label":"只列眼表檢查與用眼建議，不評估遠VA／重影","recordText":"只列眼表檢查與一般用眼建議，戴鏡遠VA偏低及近距重影暫不列後續評估"},{"id":"T04_4","label":"只列屈光／換鏡，將重影與波動皆歸入舊鏡","recordText":"只列完整屈光驗光與換鏡評估，將近距重影及眨眼相關波動全歸入原眼鏡度數問題"}]},{"id":"T05","stageId":"summary","title":"完整病例總結應保留哪些內容","evidenceIds":["HISTORY","VA","COVER","NPC","SLIT_SURFACE","FUNDUS_OBSERVED"],"kind":"summary","weight":3,"optionalModule":null,"baselineOptionId":"T05_1","options":[{"id":"T05_1","label":"所有項目健康，沒有異樣，維持原鏡即可","recordText":"全部健康，沒有異樣，病人可依原眼鏡繼續用眼"},{"id":"T05_2","label":"三項問題全部確診，直接開固定度數與療程","recordText":"已確診近視加深、集合不足、重度乾眼；立即开固定度數與療程"},{"id":"T05_3","label":"整合三條證據線、正常範圍、未測與后續計畫","recordText":"列遠距VA／PH、近眼位／NPC與重影、眼表波動線索；另列正常範圍、未測及後續計畫"},{"id":"T05_4","label":"只列VA與舊鏡，近功能／眼表皆當一般疲勞","recordText":"只列遠距VA與鏡片度數，近距功能與眼表所見放入一般疲勞，不另列待確認問題"}]}]},"case":{"schemaVersion":"4.0","id":"case01","displayTitle":"病例01","reviewStatus":"draft_requires_instructor_review","studentOpening":{"name":"林同學","age":24,"chiefComplaint":"最近戴眼鏡看遠方字比較糊；讀書一陣子眼痠，字偶爾像分開，傍晚有時霧霧的。","note":"不要在學生標題或列表顯示「集合不足／乾眼／近視加深」等答案名稱。"},"instructorConcept":"屈光相關遠距模糊待確認＋集合功能問題可疑＋眼表／淚膜不穩定線索；保留正常的結構／篩檢所見。","evidence":[{"id":"HISTORY","stageId":"initial","type":"profile","release":"stage-entry","text":["林同學，24歲，出生日期2002/04/08；日間學生兼螢幕工作。","約4個月逐漸覺得戴眼鏡看教室／遠方字幕較模糊，雙眼都有；不是突然變化。","每天螢幕約8小時，約55 cm；手機／閱讀35–40 cm。常在連續近距工作30–40分鐘後覺得眼痠，字偶爾分成兩個；看遠休息或遮任一眼後重影消失。","另有傍晚乾澀、砂粒感，畫面偶爾像蒙一層霧；完整眨幾下會短暫變清楚，這與一直存在的遠距模糊不完全相同。","未報告急性劇烈眼痛、突發視力驟降、閃光飛蚊驟增、遮幕感或外傷。","兩年前配單焦遠用鏡；無眼科手術／外傷；目前戴眼鏡、未戴隱形眼鏡。","自述無已知慢性病、固定用藥及相關眼科家族史。"]},{"id":"VA","stageId":"initial","type":"measurement","release":"stage-entry","text":["指定遠距6 m：sc OD0.2／OS0.3／OU0.4；現戴鏡cc OD0.7／OS0.8／OU0.8。","近距40 cm、cc：OD／OS／OU均1.0；持續近距用眼仍會疲勞及偶發重影。"]},{"id":"PINHOLE","stageId":"initial","type":"measurement","release":"after-I04-committed","text":["本題後續提供現戴鏡條件的分眼針孔結果：cc+PH OD1.0／OS1.0。這是題目提供資料，不代表前題所選操作已正確完成。"]},{"id":"SENSORY","stageId":"initial","type":"measurement","release":"stage-entry","text":["指定Ishihara測板按指定照明／距離分眼作答均通過。","Amsler使用此卡指定30 cm、近距所需矯正、逐眼中心注視；兩眼均未報告缺格或線條扭曲。","Titmus依40 cm、cc與偏光眼鏡；近距疲勞尚未誘發前，初測40 arcsec。"]},{"id":"COVER","stageId":"initial","type":"measurement","release":"stage-entry","text":["cc、遠6 m與近40 cm的遮蓋／去遮蓋均未見顯斜。","題目另提供交替遮蓋配合稜鏡中和的數據：遠2Δ exophoria；近10Δ exophoria。"]},{"id":"W4D","stageId":"initial","type":"measurement","release":"stage-entry","text":["本題紅片置OD、綠片置OS；遠6 m、cc看到四點。","近40 cm、cc先四點；近距重影再現時偶爾看到兩紅加三綠共五點；未提供五點的相對位置排列。"]},{"id":"NPC","stageId":"initial","type":"measurement","release":"stage-entry","text":["cc、雙眼調節性目標、鼻樑為本題基準点。三次break/recovery：14/19、13/18、14/19 cm。","break時病人報告重影，同時觀察OS向外偏離；後退至recovery恢復單一影像。"]},{"id":"NPA","stageId":"initial","type":"measurement","release":"stage-entry","text":["cc、單眼push-up、以課程核定鏡片平面作距離基準：OD8 cm、OS9 cm出現持續模糊，重複相近。"]},{"id":"SCREENING","stageId":"initial","type":"measurement","release":"stage-entry","text":["Broad H各方向完整，未見明顯運動限制；跳視準確，未見明顯過衝／欠衝。","OD／OS分眼對比視野各測區未見明顯缺損；未做自動視野。","指定照明下瞳孔OD／OS各2.5 mm、等大；直接／間接光反應存在，近距反應存在；交替光照未見RAPD。"]},{"id":"OPTIONAL_PD","stageId":"initial","type":"optional-measurement","release":"enabled-PD","text":["遠單眼PD OD32.0／OS31.5 mm；近單眼各30.5 mm。"]},{"id":"OPTIONAL_RET","stageId":"initial","type":"optional-measurement","release":"enabled-RET","text":["靜態檢影工作距離本題約67 cm，按本題設定扣1.50 D。","粗中和：OD−1.25/−0.75×180；OS−1.00/−0.50×170。只提供客觀粗值，沒有主覺最終處方。"]},{"id":"LENS_SETUP","stageId":"lensmeter","type":"instrument-observation","release":"stage-entry","text":["假設為課堂核定的手動驗度儀；尚未放鏡片，目鏡內固定刻線模糊。沒有病人口述提示。","目鏡與零位正確處理後，供後續题使用的零位核對為0。"]},{"id":"LENS_DATA","stageId":"lensmeter","type":"measurement","release":"stage-entry","text":["單焦遠用。OD兩個主經線焦點−2.00／−2.75 D；負柱鏡軸向180°。OS−1.75／−2.25 D；負柱鏡軸向170°。","本次中心對準後未測得稜鏡、無Add。數據是現戴鏡片，不是病人本次最終處方。"]},{"id":"K_INITIAL","stageId":"keratometer","type":"instrument-observation","release":"stage-entry","text":["假設課堂核定手動角膜弧度儀。初始頭位：瞳孔中心位於儀器光軸上方，下巴托偏高；額頭未穩定貼合。","對位後若要求持续睜眼，mires在數秒後變不規則：OD兩主經線讀值約43.00–43.75／44.25–45.00 D，OS43.25–43.75／44.00–44.50 D；尚不能作可靠最終讀值。"]},{"id":"K_REPEAT","stageId":"keratometer","type":"standardized-followup","release":"after-K02-committed","text":["後續題目共同提供：完成完整眨眼、置中、清晰對焦，於眨眼後盡快讀值；兩組均為OD43.00 D@180／44.25 D@90、OS43.25 D@175／44.00 D@85。","mires規則、清楚、讀值可重複。此後續資料不表示考生前題操作選項正確；K02仍按原選擇與更動紀錄評分。"]},{"id":"SLIT_SETUP","stageId":"slitlamp","type":"patient-response","release":"stage-entry","text":["初始座位與觀察焦點需按儀器核定；低倍率定位後，較強光線下病人說「這光有點太亮」，頻繁縮眼。","降低至仍能清晰觀察的照明並給短暫休息後，配合度改善；沒有持續自發性劇痛或明顯病理性畏光主訴。"]},{"id":"SLIT_SURFACE","stageId":"slitlamp","type":"exam-observation","release":"stage-entry","text":["觀察有不完整眨眼；部分瞼板腺開口堵塞外觀、少量結膜充血，淚液弧偏低。未做瞼板腺擠壓量化。","白光下角膜透明，未見明顯混濁或浸潤；表面反射在持续睜眼後變不規則，完整眨眼後暫改善。","本次未使用螢光染劑、未實測螢光TBUT、未提供染色結果。不要補出SPK、TBUT秒數或乾眼嚴重度。"]},{"id":"SLIT_CHAMBER","stageId":"slitlamp","type":"exam-observation","release":"stage-entry","text":["按課程適當前房照明所見：未見明顯細胞／閃輝。虹膜未見明顯局部異常，水晶體清澈。","未測房角、眼壓；不能由這些所見補出數值。"]},{"id":"FUNDUS_SETUP","stageId":"fundus","type":"instrument-observation","release":"stage-entry","text":["本題器材是傳統直接眼底鏡，不是PanOptic；未散瞳、較明亮環境下瞳孔約2.5 mm，較大光斑有反射／遮擋，難穩定看清。","這個細項只有檢查觀察，沒有特別口述提示；需處理光斑、環境與對焦。"]},{"id":"FUNDUS_OBSERVED","stageId":"fundus","type":"standardized-followup","release":"after-F03-committed","text":["共同提供後續實際可見所見：視盤粉紅、邊緣清楚，C/D OD0.30／OS0.30；可見中央血管走行未見明顯異常／出血，黃斑未見明顯異常。","限未散瞳直接眼底鏡可見中央範圍；周邊未完整評估，未測眼壓、OCT或自動視野。此資料是題目提供，不自動修正前面操作答案。"]}],"answerKey":{"H01":{"expectedOptionId":"H01_1","explanation":"健康與有症狀個案都需完成同一套核身、說明與同意。","optionFeedback":{"H01_1":"正確的身分與同意流程。","H01_2":"僅用單一識別資訊，未完成本試卷要求的核對。","H01_3":"檢查開始前應先完成核對與同意。","H01_4":"鏡袋不能取代本人身分核對。"},"baselineNeedsChange":false},"H02":{"expectedOptionId":"H02_2","explanation":"分開記錄持續的遠距模糊、近距重影、眨眼相關的波動，不把全部症狀混為一個診斷。","optionFeedback":{"H02_1":"漏記本病例的主訴。","H02_2":"保留時間、距離、矯正狀態及三種不同反應。","H02_3":"把症狀距離、遮眼與眨眼反應改寫成另一種情況。","H02_4":"混合三種不同反應，後續無法對照檢查。"},"baselineNeedsChange":true},"H03":{"expectedOptionId":"H03_3","explanation":"症狀提示要銜接 Cover、W4D、NPC 與眼球運動，而非直接貼疾病標籤。","optionFeedback":{"H03_1":"忽略已提供的重影描述。","H03_2":"漏掉這種遮眼反應對雙眼功能檢查的提示。","H03_3":"依描述選擇相關檢查，尚不確診。","H03_4":"眼球運動正常不替代眼位、融合與集合評估。"},"baselineNeedsChange":true},"H04":{"expectedOptionId":"H04_1","explanation":"目前題目未提供急症警訊；保留常規檢查，不以「無眼痛」排除其他問題。","optionFeedback":{"H04_1":"與本病例已提供的警訊資料一致。","H04_2":"沒有急性起病或其他相應警訊，這不是本題支持的唯一首要處理。","H04_3":"陰性警訊不能作省略既定必要檢查的理由。","H04_4":"雖繼續流程，卻漏掉有臨床意義的症狀時程與性質。"},"baselineNeedsChange":false},"H05":{"expectedOptionId":"H05_4","explanation":"病例資料和實測鏡片度數應分欄，不能把眼鏡度數當成現在的最終處方。","optionFeedback":{"H05_1":"平光資料與病例不符。","H05_2":"病例未提供這些病史或鏡片。","H05_3":"不足以對照現戴矯正視力與驗度儀結果。","H05_4":"完   function makeOptionOrder(){const out={};for(const q of DATA.bank.questions){const ids=q.options.map(x=>x.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}out[q.id]=ids;}return out;}

  function changeOption(qid,optionId){const q=QUESTION_BY_ID[qid];if(!q||!q.options.some(o=>o.id===optionId)||!isQuestionUnlocked(q))return;const s=activeSelectionState();const old=s.selectedOptionByQuestion[qid];if(old===optionId)return;s.selectedOptionByQuestion[qid]=optionId;pushEvent('change-option',{questionId:qid,oldOptionId:old,newOptionId:optionId});safeSave();const el=document.getElementById(`q-${qid}`);if(el){const preview=el.querySelector('.record-preview');const opt=q.options.find(o=>o.id===optionId);preview.innerHTML=`<strong>目前會寫入病歷：</strong> ${esc(opt.recordText)}`;}}

  function snapshotLabel(q,snapshot){const o=selectedOption(q,snapshot);return o?`${esc(o.label)}<div class="tiny muted">${esc(o.recordText)}</div>`:'—';}
  function buildChart(snapshot){return allActiveQuestions().map(q=>{const reviewed=(snapshot.reviewedQuestionIds||[]).includes(q.id);const o=selectedOption(q,snapshot);const refs=q.evidenceIds.map(id=>EVIDENCE_LABELS[id]||id).join('、');return `<article class="result-card"><h3>${esc(q.title)} <span class="q-code">${esc(q.id)}</span></h3><div class="result-row"><div class="result-label">作答狀態</div><div class="result-value">${statusTag(statusFor(q,snapshot))}</div></div><div class="result-row"><div class="result-label">我的病歷</div><div class="result-value">${reviewed?esc(o?.recordText||'未選擇'):'本題未核對；健康基準仍保留為預設值，未視為已完成檢查。'}${reviewed?`<div class="tiny muted">資料來源：${esc(refs)}（題目提供／檢查資料）</div>`:''}</div></div></article>`;}).join('');}
  function buildComparison(snapshot){return allActiveQuestions().map(q=>{const st=statusFor(q,snapshot);const mine=selectedOption(q,snapshot);const expected=expectedOption(q);const base=q.options.find(o=>o.id===q.baselineOptionId);const feedback=DATA.case.answerKey[q.id]?.optionFeedback?.[mine?.id]||'';const released=(snapshot.revealedEvidenceIds||[]);const evidenceTexts=q.evidenceIds.filter(id=>released.includes(id)).map(id=>getEvidence(id)).filter(Boolean).map(e=>`${EVIDENCE_LABELS[e.id]||e.id}：${(e.text||[]).join(' ')}`);const unreleased=q.evidenceIds.filter(id=>!released.includes(id)).map(id=>EVIDENCE_LABELS[id]||id);const evidenceNote=[evidenceTexts.length?`已提供：${evidenceTexts.join('　')}`:'',unreleased.length?`本次未取得：${unreleased.join('、')}`:''].filter(Boolean).join('；');return `<article class="result-card" data-qstage="${esc(q.stageId)}" data-qstatus="${esc(st)}"><h3>${esc(q.title)} <span class="q-code">${esc(q.id)}</span></h3><div class="result-row"><div class="result-label">作答狀態</div><div class="result-value">${statusTag(st)}</div></div><div class="result-row"><div class="result-label">健康基準</div><div class="result-value">${esc(base?.label||'—')}<div class="tiny muted">${esc(base?.recordText||'')}</div></div></div><div class="result-row"><div class="result-label">我的選項</div><div class="result-value">${mine?`${esc(mine.label)}<div class="tiny muted">${esc(mine.recordText)}</div>`:'未選擇'}</div></div><div class="result-row"><div class="result-label">標準選項</div><div class="result-value">${esc(expected?.label||'—')}<div class="tiny muted">${esc(expected?.recordText||'')}</div></div></div><div class="result-row"><div class="result-label">病例依據與回饋</div><div class="result-value">${esc(evidenceNote||q.evidenceIds.map(id=>EVIDENCE_LABELS[id]||id).join('、'))}<div class="tiny" style="margin-top:5px">${esc(feedback)}</div></div></div></article>`;}).join('');}
  function timelineHtml(snapshot){const ev=snapshot.events||[];if(!ev.length)return '<div class="empty">沒有流程事件。</div>';return `<ol class="timeline">${ev.map(e=>`<li><strong>${esc(eventLabel(e.type))}</strong><div class="tiny muted">${esc(new Date(e.at).toLocaleString('zh-TW'))} ${esc(eventDetail(e))}</div></li>`).join('')}</ol>`;}
  function eventLabel(t){return ({start:'開始作答', 'enter-stage':'進入階段','leave-stage':'離開階段','reveal-evidence':'取得題目觀察資料','change-option':'修改選項','confirm-trigger-item':'確認單項並揭露資料','confirm-group':'核對題組','submit':'手動交卷','expire':'時間到自動交卷','enter-review-edit':'開始回顧修訂','save-review-edit':'保存修訂'})[t]||t;}
  function eventDetail(e){if(e.questionId)return `${e.questionId}${e.oldOptionId?`：${e.oldOptionId} → ${e.newOptionId}`:''}`;if(e.stageId)return DATA.config.stages.find(x=>x.id===e.stageId)?.title||e.stageId;if(e.evidenceId)return EVIDENCE_LABELS[e.evidenceId]||e.evidenceId;if(e.questionIds)return `已核對 ${e.questionIds.length} 題`;return e.reason||'';}
  function renderResults(){clearInterval(timerHandle);if(!attempt?.firstSnapshot)return renderHome();setHeader('submitted');const snap=resultView==='first'?attempt.firstSnapshot:attempt.revisions.find(r=>`revision-${r.number}`===resultView)?.snapshot||attempt.firstSnapshot;const score=scoreSnapshot(snap);const counts=countStatuses(snap);const isRev=resultView!=='first';const revisions=attempt.revisions.filter(r=>r.snapshot);const tabs=[['chart','我的病歷／操作'],['compare','逐題對照與檢漏'],['teacher','教師標準病例總結'],['timeline','流程紀錄']];app.innerHTML=`<section class="card result-head"><div class="eyebrow" style="color:var(--green)">CASE 01 · ${attempt.mode==='formal'?'正式模擬':'練習模式'}</div><h1 style="margin:6px 0 0">${isRev?'回顧修訂結果':'完成作答'}</h1><p class="muted" style="margin:6px 0 0">${isRev?'這是修訂版本；首次交卷的選項、時間與分數仍保留。':'第一次交卷快照已固定。'} 分數反映網頁選項與流程完成度，不代表實機操作熟練度。</p><div class="score-strip"><div class="metric"><strong>${score.total?`${score.earned}/${score.total}`:'—'}</strong><span>加權符合度${score.total?` · ${score.percent}%`:''}</span></div><div class="metric"><strong>${counts.unreviewed}</strong><span>未核對／未完成</span></div><div class="metric"><strong>${counts.missed}</strong><span>漏改必要欄位</span></div><div class="metric"><strong>${counts.unnecessary+counts.wrong}</strong><span>其他錯誤</span></div></div><div class="status-counts" style="margin-top:12px">${Object.keys(STATUS).map(k=>`<div class="status-count">${statusTag(k)}<b>${counts[k]}</b><span>適用題目</span></div>`).join('')}</div><div class="actions"><button id="reviseButton" class="button soft" type="button">回顧修訂（保留首次交卷）</button><button id="newRoundButton" class="button" type="button">開始新回合</button><button id="printButton" class="button" type="button">列印結果</button><button id="exportResult" class="button" type="button">匯出作答 JSON</button></div>${revisions.length?`<div class="filter-row"><span class="muted tiny" style="align-self:center">查看版本</span><button class="button small ${resultView==='first'?'soft':''}" data-result-view="first">首次交卷</button>${revisions.map(r=>`<button class="button small ${resultView===`revision-${r.number}`?'soft':''}" data-result-view="revision-${r.number}">修訂 ${r.number}</button>`).join('')}</div>`:''}</section>
      <div class="tabbar" role="tablist">${tabs.map(([id,label])=>`<button class="tab-button ${resultTab===id?'active':''}" role="tab" data-tab="${id}">${label}</button>`).join('')}</div>
      <section class="tab-panel ${resultTab==='chart'?'active':''}" data-panel="chart"><div class="notice">以下病歷文字取自你實際選擇的選項。未核對欄位不列為已完成的正常檢查。</div><div class="review-grid">${buildChart(snap)}</div></section>
      <section class="tab-panel ${resultTab==='compare'?'active':''}" data-panel="compare"><div class="section-heading"><div><h2>逐題核對與檢漏</h2><p>分類數合計 ${Object.values(counts).reduce((a,b)=>a+b,0)} 題；加權符合度使用本回合適用題作分母。</p></div><div class="filter-row"><select id="stageFilter"><option value="all">全部階段</option>${DATA.config.stages.map(s=>`<option value="${esc(s.id)}" ${resultStageFilter===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select><select id="statusFilter"><option value="all">全部狀態</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('')}</select></div></div><div id="comparisonList">${buildComparison(snap)}</div></section>
      <section class="tab-panel ${resultTab==='teacher'?'active':''}" data-panel="teacher"><div class="teacher-banner"><strong>教學擬定答案，待教師核定</strong><br>病例鍵狀態：${esc(DATA.case.reviewStatus)}。這些內容與「我的病歷」分開，不會覆寫考生作答。</div><article class="result-card"><h2>教師標準病例總結</h2><div class="expected-summary">${esc(DATA.case.expectedSummary)}</div></article><div class="notice">本病例未提供最終配鏡處方、近用 Add、稜鏡量、染色／TBUT、眼壓、OCT、自動視野或完整周邊眼底結果；不可補寫為已測或已確診。</div></section>
      <section class="tab-panel ${resultTab==='timeline'?'active':''}" data-panel="timeline"><div class="card pad"><h2 style="margin-top:0">操作時間與順序</h2><p class="muted">選項變更、站別進出、資料揭露、題組核對及交卷均保留時間。</p>${timelineHtml(snap)}</div></section>`;
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{resultTab=b.dataset.tab;renderResults();});
    document.getElementById('reviseButton').onclick=beginReviewEdit;
    document.getElementById('newRoundButton').onclick=startNewRound;
    document.getElementById('printButton').onclick=()=>window.print();
    document.getElementById('exportResult').onclick=exportAttempt;
    document.querySelectorAll('[data-result-view]').forEach(b=>b.onclick=()=>{resultView=b.dataset.resultView;renderResults();});
    const sf=document.getElementById('stageFilter'), stf=document.getElementById('statusFilter');
    const applyFilter=()=>{document.querySelectorAll('#comparisonList .result-card').forEach(card=>{const id=card.querySelector('.q-code')?.textContent;const q=QUESTION_BY_ID[id];card.classList.toggle('hide',!!((sf.value!=='all'&&q?.stageId!==sf.value)||(stf.value!=='all'&&statusFor(q,snap)!==stf.value)));});};sf.value=resultStageFilter;sf.onchange=()=>{resultStageFilter=sf.value;applyFilter();};stf.onchange=applyFilter;
    setHeader('submitted');
  }
  function renderTeacher(){clearInterval(timerHandle);timerEl.classList.add('hide');backupButton.classList.add('hide');const questions=DATA.bank.questions;app.innerHTML=`<section class="hero"><div class="eyebrow">INSTRUCTOR VIEW · CASE 01</div><h1>考官資料與評分參考</h1><p>答案鍵與病例資料僅供教師核對。單檔靜態頁面無法保密前端資料，請勿把此頁當成安全的答案隔離。</p></section><section class="section card pad"><div class="teacher-banner"><strong>目前狀態：${esc(DATA.case.reviewStatus)}</strong><br>下列為教學擬定答案，正式採用前由授課教師核定各項流程、儀器型號與判讀。</div><div class="actions"><button id="teacherBack" class="button" type="button">返回考生首頁</button><button id="teacherPrint" class="button" type="button">列印考官資料</button><button id="teacherExport" class="button" type="button">匯出目前作答 JSON</button></div><article class="result-card"><h2>病例標準總結</h2><div class="expected-summary">${esc(DATA.case.expectedSummary)}</div></article><div class="filter-row"><select id="teacherStage"><option value="all">全部階段</option>${DATA.config.stages.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('')}</select></div><div id="teacherQuestions">${questions.map(q=>{const ans=expectedOption(q);const key=DATA.case.answerKey[q.id];return `<article class="result-card" data-stage="${esc(q.stageId)}"><h3>${esc(q.title)} <span class="q-code">${esc(q.id)}</span></h3><div class="result-row"><div class="result-label">標準選項</div><div class="result-value">${esc(ans?.label||'—')}<div class="tiny muted">${esc(ans?.recordText||'')}</div></div></div><div class="result-row"><div class="result-label">解析</div><div class="result-value">${esc(key?.explanation||'')}</div></div><div class="result-row"><div class="result-label">分數權重／基準</div><div class="result-value">${q.weight}／${esc(q.options.find(o=>o.id===q.baselineOptionId)?.label||'')}</div></div></article>`;}).join('')}</div><article class="result-card"><h2>真人實機核檢清單</h2><ul>${['目鏡刻線對焦與零位','鏡片定位、眼別辨識與主經線讀取','病人頭位、注視與儀器對準','角膜mires清晰度、眨眼時機及穩定讀值','裂隙燈光束、倍率、照明及對焦操作','傳統直接眼底鏡雙側姿勢、接近距離與病人舒適度','口頭總結與病歷欄位一致性'].map(x=>`<li>${esc(x)}：□ 完成　□ 需改善　□ 未執行</li>`).join('')}</ul></article></section>`;
    document.getElementById('teacherBack').onclick=()=>{location.hash='';renderHome();};document.getElementById('teacherPrint').onclick=()=>window.print();document.getElementById('teacherExport').onclick=exportAttempt;document.getElementById('teacherStage').onchange=e=>document.querySelectorAll('#teacherQuestions [data-stage]').forEach(x=>x.classList.toggle('hide',e.target.value!=='all'&&x.dataset.stage!==e.target.value));
  }
  function renderRoute(){if(location.hash==='#teacher')return renderTeacher();if(!attempt){renderHome();return;}if(attempt.status==='review-edit'||attempt.status==='active')renderExam();else renderResults();}
  backupButton.onclick=exportAttempt;
  window.addEventListener('hashchange',renderRoute);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&attempt?.mode==='formal'&&attempt.status==='active'&&Date.now()>=Date.parse(attempt.deadlineAt))finalizeSubmit('expire');else updateTimer();});
  attempt=loadStored();
  if(attempt?.mode==='formal'&&attempt.status==='active'&&Date.now()>=Date.parse(attempt.deadlineAt)){attempt.status='submitted';attempt.submittedAt=iso();attempt.submitReason='expire';attempt.events||=[];attempt.events.push({type:'expire',at:attempt.submittedAt,reason:'expire'});attempt.firstSnapshot={selectedOptionByQuestion:clone(attempt.selectedOptionByQuestion),reviewedQuestionIds:[...(attempt.reviewedQuestionIds||[])],confirmedStageIds:[...(attempt.confirmedStageIds||[])],revealedEvidenceIds:[...(attempt.revealedEvidenceIds||[])],events:clone(attempt.events),submittedAt:attempt.submittedAt};safeSave();}
  renderRoute();
  </script>
